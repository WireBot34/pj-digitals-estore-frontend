# For the Docker container that serves the built site (used on server day).
# Cloudflare Tunnel -> this nginx -> /usr/share/nginx/html (the Vite "dist" folder).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # build files have hashed names: cache for a year
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /icons/  { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }

  # the service worker and manifest must never be cached, or updates never reach phones
  location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } try_files $uri =404; }
  location = /offline.html { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # single-page app: every other path serves index.html
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
